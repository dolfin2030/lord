version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: door-shop-db
    environment:
      POSTGRES_USER: doorshop
      POSTGRES_PASSWORD: doorshop_secret
      POSTGRES_DB: doorshop
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - door-shop-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doorshop"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: door-shop-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - door-shop-network
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api/Dockerfile
    container_name: door-shop-api
    environment:
      DATABASE_URL: postgresql://doorshop:doorshop_secret@postgres:5432/doorshop
      REDIS_URL: redis://redis:6379
      PORT: 3001
      NODE_ENV: development
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - door-shop-network
    volumes:
      - ./apps/api:/app
      - /app/node_modules

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web/Dockerfile
    container_name: door-shop-web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
      NODE_ENV: development
    ports:
      - "3000:3000"
    depends_on:
      - api
    networks:
      - door-shop-network
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next

  admin:
    build:
      context: .
      dockerfile: infrastructure/docker/admin/Dockerfile
    container_name: door-shop-admin
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
      NODE_ENV: development
    ports:
      - "3002:3002"
    depends_on:
      - api
    networks:
      - door-shop-network
    volumes:
      - ./apps/admin:/app
      - /app/node_modules
      - /app/.next

  nginx:
    image: nginx:alpine
    container_name: door-shop-nginx
    ports:
      - "80:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - web
      - admin
    networks:
      - door-shop-network

volumes:
  postgres_data:
  redis_data:

networks:
  door-shop-network:
    driver: bridge
